<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" role="img" aria-labelledby="title desc">
<title id="title">Vishwanath Muthuraman — Engineering better decisions</title>
<desc id="desc">Original animated illustration of data flowing through context into decisions. Data platforms, AI systems and technical delivery. The illustration is conceptual.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b131b"/><stop offset="1" stop-color="#142d32"/></linearGradient><linearGradient id="signal"><stop stop-color="#64dddf"/><stop offset="1" stop-color="#c6f584"/></linearGradient><radialGradient id="halo"><stop stop-color="#64dddf" stop-opacity=".13"/><stop offset="1" stop-color="#64dddf" stop-opacity="0"/></radialGradient></defs>
<style>.signal{animation:flow 12s linear infinite}.ring{animation:breathe 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.signal,.ring{animation:none}}</style>
<rect x="1" y="1" width="618" height="438" rx="24" fill="url(#bg)" stroke="#31515c"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="48" fill="#a1b9c1" font-size="20" font-weight="700" letter-spacing="1.4">VISHWANATH MUTHURAMAN</text><text x="30" y="122" font-size="61" font-weight="700" letter-spacing="-2" fill="#effaf6">Engineering</text><text x="30" y="185" font-size="61" font-weight="700" letter-spacing="-2" fill="#c6f584">better decisions.</text><text x="33" y="229" font-size="22" fill="#a1b9c1">Data platforms · AI systems · Technical delivery</text></g>
<path d="M110 328 H510" stroke="#31515c" stroke-width="2"/><path class="signal" d="M110 328 H510" stroke="url(#signal)" stroke-width="3" stroke-dasharray="5 31" fill="none"/>
<g transform="translate(110 328)"><circle r="35" fill="#13252e" stroke="#64dddf"/><path d="M-12 -8 H12 M-12 0 H6 M-12 8 H12" fill="none" stroke="#c6f584" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="110" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#a1b9c1" font-size="15" letter-spacing="2">DATA</text>
<g transform="translate(310 328)"><circle r="35" fill="#13252e" stroke="#64dddf"/><path d="M-12 -10 H12 L0 12 Z" fill="none" stroke="#c6f584" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="310" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#a1b9c1" font-size="15" letter-spacing="2">CONTEXT</text>
<g transform="translate(510 328)"><circle r="35" fill="#13252e" stroke="#64dddf"/><path d="M-12 0 L-3 9 L14 -10" fill="none" stroke="#c6f584" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="510" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#a1b9c1" font-size="15" letter-spacing="2">DECISIONS</text>
</svg>
